name: Release to npm

on:
  release:
    types:
      - published
  workflow_dispatch:

jobs:
  publish-to-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # npm trusted publishing (OIDC) — no NPM_TOKEN. Configured on npmjs.com:
      # package settings -> Trusted Publisher -> GitHub Actions,
      # repo surendranb/macos-mcp, workflow release.yml.
      id-token: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24.x"
          registry-url: "https://registry.npmjs.org"

      - name: Update npm (trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Publish to npm
        run: npm publish --access public
