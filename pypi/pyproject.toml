[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "macos-companion-mcp"
version = "1.3.2"
description = "macOS Companion MCP server for AI agents: system control, clipboard, notifications, audio, and workspace automation."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "Surendran B", email = "reachsuren@gmail.com" },
]
keywords = ["mcp", "mcp-server", "macos", "apple", "automation", "claude", "claude-code", "cursor"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.scripts]
macos-companion-mcp = "macos_companion_mcp:main"
macos-mcp = "macos_companion_mcp:main"

[project.urls]
Homepage = "https://github.com/surendranb/macos-mcp"
Repository = "https://github.com/surendranb/macos-mcp"
Issues = "https://github.com/surendranb/macos-mcp/issues"
